# Save as: .github/workflows/update-scholar.yml
# Refreshes data/publications.json from Google Scholar every Monday,
# and whenever you click "Run workflow" on the Actions tab.

name: Update Google Scholar publications

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests scholarly

      - name: Fetch publications
        env:
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}        # repo Settings > Variables
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional, Settings > Secrets
          OUTPUT_PATH: data/publications.json
        run: python scripts/fetch_scholar.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Google Scholar publications"
            git push
          fi
